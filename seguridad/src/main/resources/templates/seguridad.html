
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Red Social | Seguridad</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 32px;
            font-weight: 800;
            color: #e0e0e0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            color: #00e5ff;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.3));
        }
    </style>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Estilos de Red Social -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <main class="contenedor">

      
<div class="encabezado cabecera-logo">
    <div class="logo-container">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                Conexa
            </div>
</div>

        <section class="contenido">

            <h2 class="titulo">SEGURIDAD</h2>

            <div class="mt-4 d-flex flex-wrap justify-content-center">

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/usuario}'|">
                    Usuario
                </button>

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/rol}'|">
                    Rol
                </button>

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/tipo_privacidad}'|">
                    Tipo Privacidad
                </button>

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/rol_fan_page}'|">
                    Rol Fan Page
                </button>

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/index}'|">
                    Volver
                </button>

            </div>

        </section>

    </main>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
