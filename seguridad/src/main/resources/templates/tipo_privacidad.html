
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Red Social | Seguridad</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Estilos de Red Social -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <main class="contenedor">


        <section class="contenido">

            <h2 class="titulo">Tipo Privacidad</h2>

            <div class="mt-4 d-flex flex-wrap justify-content-center">

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/tipo_privacidad_agregar}'|">
                    Agregar
                </button>

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/tipo_privacidad_listar}'|">
                    Listar
                </button>

                <button class="boton" type="button"
                        th:onclick="|location.href='@{/seguridad}'|">
                    Volver
                </button>

            </div>

        </section>

    </main>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
