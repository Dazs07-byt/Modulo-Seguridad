#Especifica que se usara el protocolo jdbc:postgresql,el servidor esta en localhost(la misma maquina), el puerto es el 5432 (el puerto a la que se debe conectar es red_social
spring.datasource.url=jdbc:postgresql://localhost:5433/redsocial

#Configura el nombre de usuario (postgres) que se utilizara parra conectarse a la base de datos.
spring.datasource.username=postgres

#configurar la clave asociada al usuario que se utilizara para conectarse a la base de datos
spring.datasource.password=1234

#establece el nombre de la aplicacion spring boot como "seguridad
spring.application.name="seguridad"

#especifica que se debe utilizar el controlador JDBC de postgresql para interactuar con una base de datos, informando a spring como debe conectarse y comunicarse con una base de datos postgresql especifica
spring.datasource.driver-class-name=org.postgresql.Driver

#dehabilita gestion automatica del esquema de la base de datos por parte hibernate. esto significa que hibernate no realizara ninguna operacion de lenguaje de definicion de datos (DOL) como crear, actualizarce o validar tablas al iniciar la aplicacion; el esquema de la base de datos debe ser gestionados manualmente
spring.jpa.hibernate.ddl-auto=none

#le dice a springy a hibernate como generar el codigo sql optimo y las interacciones de persistencia especificas para la base de datos postgresql, asegurando que el codigo de la aplicacion pueda interactuar correctamente con ella sin necesidad de cambios.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#consideraciones para produccion:
#en un entorno de produccion las credenciales (host,usuarion,contraseña) deben estar codificadas directamente en application.properties.

#en su lugar, se deben utilizar variables de entorno o un sistema de gestion de secretos para cargar estas propiedades.












